[tox]
envlist =
    ; py36
    ; c0
    c1
    ; lint

skip_missing_interpreters = true

[tool:pytest]
minversion = 3.0
testpaths = tests

[coverage:run]
source =
    invenio_indexer

[coverage:paths]
source =
    invenio_indexer
    .tox/*/lib/python*/site-packages/invenio_indexer

[flake8]
max-line-length = 119
exclude =
    .git
    __pychache__
    .tox
    venv

[isort]
profile=black

[pytest]
timeout = 300

[tool:isort]
line_length = 119

[mypy]
python_version = 3.6
warn_return_any = True
warn_unused_configs = True

[mypy-flask]
ignore_missing_imports = True

[testenv]
passenv = LANG
deps =
    pytest>=3
commands =
    pytest -v --basetemp="{envtmpdir}" {posargs}

[testenv:c0]
setuptools_version = 57.5.0
passenv = LANG
deps =
    pytest>=3
    pytest-cov
commands =
    pytest --cov=invenio_indexer tests -v --cov-report=term --basetemp="{envtmpdir}" {posargs}

[testenv:c1]
passenv =
    LANG
    SQLALCHEMY_DATABASE_URI
    BROKER_URL
    SEARCH_OPENSEARCH_HOSTS
    INVENIO_OPENSEARCH_USER
    INVENIO_OPENSEARCH_PASS
    PYTHONPATH
    EVIDENCE_PREFIX
setenv =
    COVERAGE_FILE = {env:EVIDENCE_PREFIX:{toxinidir}/coverage}.coverage
deps =
    pytest>=3
    pytest-cov
    -rrequirements2.txt
commands =
    python -m pytest --cov=invenio_indexer --cov-config=tox.ini --cov-branch --cov-report=term --cov-report=xml:{env:EVIDENCE_PREFIX:{toxinidir}/coverage}-coverage.xml --cov-report=html:{env:EVIDENCE_PREFIX:{toxinidir}/coverage}-html --cov-report=json:{env:EVIDENCE_PREFIX:{toxinidir}/coverage}-coverage.json --basetemp="{envtmpdir}" -v {posargs:tests}

[testenv:lint]
passenv = LANG
deps =
    black
    isort
    flake8
    mypy
commands =
    black .
    isort .
    flake8 .
    mypy invenio_indexer


[testenv:radon]
passenv = LANG
deps =
    radon
commands =
    radon cc invenio_indexer
    radon mi invenio_indexer

