[tox]
envlist =
    ; py36
    ; c0
    c1
	; lint
parallel_show_output = True
skip_missing_interpreters = true

[tool:pytest]
minversion = 3.0
testpaths = tests

[coverage:run]
source =
    weko_accounts

[coverage:paths]
source =
    weko_accounts
    .tox/*/lib/python*/site-packages/weko_accounts

[flake8]
max-line-length = 119
exclude =
    .git
    __pychache__
    .tox
    venv

[isort]
profile=black

[pytest]
timeout = 300
filterwarnings =
    default:ast\.Str is deprecated:DeprecationWarning:werkzeug\.routing\.rules
    default:Attribute s is deprecated:DeprecationWarning:werkzeug\.routing\.rules
    default:Attribute s is deprecated:DeprecationWarning:ast

[tool:isort]
line_length = 119

[mypy]
python_version = 3.6
warn_return_any = True
warn_unused_configs = True

[mypy-flask]
ignore_missing_imports = True

[testenv]
passenv = LANG SQLALCHEMY_DATABASE_URI CACHE_REDIS_HOST PYTHONPATH EVIDENCE_PREFIX
deps =
    pytest>=3
commands =
   python -m pytest -v --basetemp="{envtmpdir}" {posargs:tests}

[testenv:c0]
setuptools_version = 57.5.0
passenv = LANG SQLALCHEMY_DATABASE_URI CACHE_REDIS_HOST PYTHONPATH EVIDENCE_PREFIX
deps =
    pytest>=3
    pytest-cov
commands =
   python -m pytest --cov=weko_accounts -v --cov-report=term --basetemp="{envtmpdir}" {posargs:tests}

[testenv:c1]
setenv =
    TIKA_LOG_PATH = {envdir}
setuptools_version = 57.5.0
passenv = LANG SQLALCHEMY_DATABASE_URI CACHE_REDIS_HOST PYTHONPATH EVIDENCE_PREFIX
deps =
    opensearch-py
    pytest>=3
    pytest-cov
	-rrequirements2.txt
commands =
   python -m pytest --cov=weko_accounts -v --cov-branch --cov-report=term --cov-report=xml --cov-report=html --basetemp="{envtmpdir}" {posargs:tests}

[testenv:lint]
passenv = LANG
deps =
	black
	isort
	flake8
	mypy
commands =
	black .
	isort .
	flake8 .
	mypy weko_accounts


[testenv:radon]
passenv = LANG
deps = 
	radon
commands = 
	radon cc weko_accounts
	radon mi weko_accounts

