[tox]
envlist =
    ; py36
    ; c0
    c1
	; lint
parallel_show_output = True
skip_missing_interpreters = true

[tool:pytest]
minversion = 3.0
testpaths = tests

[coverage:run]
source =
    weko_swordserver

[coverage:paths]
source =
    weko_swordserver
    .tox/*/lib/python*/site-packages/weko_swordserver

[flake8]
max-line-length = 119
exclude =
    .git
    __pychache__
    .tox
    venv

[isort]
profile=black

[pytest]
timeout = 300
filterwarnings =
    default:ast\.Str is deprecated:DeprecationWarning:werkzeug\.routing\.rules
    default:Attribute s is deprecated:DeprecationWarning:werkzeug\.routing\.rules
    default:Attribute s is deprecated:DeprecationWarning:ast

[tool:isort]
line_length = 119

[mypy]
python_version = 3.6
warn_return_any = True
warn_unused_configs = True

[mypy-flask]
ignore_missing_imports = True

[testenv]
usedevelop = True
passenv =
    LANG
    SQLALCHEMY_DATABASE_URI
    PYTHONPATH
    EVIDENCE_PREFIX
    COVERAGE_FILE
deps =
    pytest>=3
commands =
    python -m pytest --basetemp="{envtmpdir}" {posargs:tests}

[testenv:c0]
setuptools_version = 57.5.0
passenv =
    LANG
    SQLALCHEMY_DATABASE_URI
    PYTHONPATH
    EVIDENCE_PREFIX
    COVERAGE_FILE
deps =
    pytest>=3
    pytest-cov
commands =
    python -m pytest --cov=weko_swordserver --cov-report=term --cov-config=tox.ini --basetemp="{envtmpdir}" {posargs:tests}

[testenv:c1]
setuptools_version = 57.5.0
passenv =
    LANG
    SQLALCHEMY_DATABASE_URI
    PYTHONPATH
    EVIDENCE_PREFIX
    COVERAGE_FILE
    INVENIO_OPENSEARCH_USER
    INVENIO_OPENSEARCH_PASS
deps =
    pytest>=3
    pytest-cov
    coverage
    -rrequirements2.txt
commands =
    python -m pytest --cov=weko_swordserver -v --cov-branch --cov-report=term --cov-report=xml:{envtmpdir}/coverage.xml --cov-report=html:{envtmpdir}/htmlcov  --cov-config=tox.ini --basetemp="{envtmpdir}" {posargs:tests}

[testenv:lint]
passenv = LANG
usedevelop = True
deps =
    black
    isort
    flake8
    mypy
commands =
    black .
    isort .
    flake8 .
    mypy weko_swordserver


[testenv:radon]
passenv = LANG
deps =
    radon
commands =
    radon cc weko_swordserver
    radon mi weko_swordserver
