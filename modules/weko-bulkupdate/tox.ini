[tox]
envlist =
    ; py36
    ; c0
    c1
	; lint
parallel_show_output = True
skip_missing_interpreters = true

[tool:pytest]
minversion = 3.0
testpaths = tests

[coverage:run]
source =
    weko_bulkupdate

[coverage:paths]
source =
    weko_bulkupdate
    .tox/*/lib/python*/site-packages/weko_bulkupdate

[flake8]
max-line-length = 119
exclude =
    .git
    __pychache__
    .tox
    venv

[isort]
profile=black

[pytest]
timeout = 300

[tool:isort]
line_length = 119

[mypy]
python_version = 3.6
warn_return_any = True
warn_unused_configs = True

[mypy-flask]
ignore_missing_imports = True

[testenv]
usedevelop = True
passenv =
    LANG
    PYTHONPATH
    EVIDENCE_PREFIX
deps =
    pytest>=3
commands =
   python -m pytest -v --basetemp="{envtmpdir}" {posargs:tests}

[testenv:c0]
deps =
    pytest>=3
    pytest-cov
commands =
   python -m pytest --cov=weko_bulkupdate -v --cov-report=term --cov-config=tox.ini --basetemp="{envtmpdir}" {posargs:tests}

[testenv:c1]
deps =
    pytest>=3
    pytest-cov
	-rrequirements2.txt
    pytest-timeout==2.4.0
commands =
   python -m pytest --cov=weko_bulkupdate -v --cov-branch --cov-report=term --cov-report=xml:"{env:CI_ARTIFACT_DIR}/coverage.xml" --cov-report=html:"{env:CI_ARTIFACT_DIR}/htmlcov" --cov-config=tox.ini --basetemp="{envtmpdir}/pytest" --cov-report=json:"{env:CI_ARTIFACT_DIR}/coverage.json" --junitxml="{env:CI_ARTIFACT_DIR}/junit.xml" {posargs:tests}
passenv =
    LANG
    PYTHONPATH
    EVIDENCE_PREFIX
    COVERAGE_FILE
    CI_ARTIFACT_DIR
    PYTEST_TIMEOUT
setenv =
    CI_ARTIFACT_DIR = {env:CI_ARTIFACT_DIR:{toxworkdir}/reports/c1}
    COVERAGE_FILE = {env:COVERAGE_FILE:{env:CI_ARTIFACT_DIR}/.coverage}
commands_pre =
    python -c "import pathlib, sys; pathlib.Path(sys.argv[1]).mkdir(parents=True, exist_ok=True)" "{env:CI_ARTIFACT_DIR}"

[testenv:lint]
passenv = LANG
deps =
	black
	isort
	flake8
	mypy
commands =
	black .
	isort .
	flake8 .
	mypy weko_bulkupdate


[testenv:radon]
passenv = LANG
deps = 
	radon
commands = 
	radon cc weko_bulkupdate
	radon mi weko_bulkupdate

