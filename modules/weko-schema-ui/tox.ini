[tox]
envlist =
    ; py36
    ; c0
    c1
	; lint
parallel_show_output = True
skip_missing_interpreters = true

[tool:pytest]
minversion = 3.0
testpaths = tests

[coverage:run]
source =
    weko_schema_ui

[coverage:paths]
source =
    weko_schema_ui
    .tox/*/lib/python*/site-packages/weko_schema_ui

[flake8]
max-line-length = 119
exclude =
    .git
    __pychache__
    .tox
    venv

[isort]
profile=black

[pytest]
timeout = 300
# Keep first reports of known Python 3.12 AST deprecations without retaining
# tens of thousands of duplicate warning objects for each Flask application.
filterwarnings =
    default:ast\.Str is deprecated:DeprecationWarning:werkzeug\.routing\.rules
    default:Attribute s is deprecated:DeprecationWarning:werkzeug\.routing\.rules
    default:Attribute s is deprecated:DeprecationWarning:ast

[tool:isort]
line_length = 119

[mypy]
python_version = 3.6
warn_return_any = True
warn_unused_configs = True

[mypy-flask]
ignore_missing_imports = True

[testenv]
passenv = LANG
deps =
    pytest>=3
commands =
   pytest -v --basetemp="{envtmpdir}" {posargs}

[testenv:c0]
setuptools_version = 57.5.0
passenv = LANG
deps =
    pytest>=3
    pytest-cov
commands =
   pytest --cov=weko_schema_ui tests -v --cov-report=term --basetemp="{envtmpdir}" {posargs}

[testenv:c1]
setuptools_version = 57.5.0
passenv =
    LANG
    SQLALCHEMY_DATABASE_URI
    CACHE_REDIS_HOST
    CACHE_REDIS_URL
    INVENIO_OPENSEARCH_USER
    INVENIO_OPENSEARCH_PASS
    SEARCH_OPENSEARCH_HOSTS
    PYTHONPATH
    EVIDENCE_PREFIX
    COVERAGE_FILE
    CI_ARTIFACT_DIR
    SEARCH_HOST
    PYTEST_TIMEOUT
deps =
    pytest>=3
    pytest-cov
	-rrequirements2.txt
    #-rrequirements.txt
    pytest-timeout==2.4.0
commands =
   python -m pytest --cov=weko_schema_ui -v -vv --cov-branch --cov-report=term --cov-report=xml:"{env:CI_ARTIFACT_DIR}/coverage.xml" --cov-report=html:"{env:CI_ARTIFACT_DIR}/htmlcov" --cov-config=tox.ini --basetemp="{envtmpdir}/pytest" --cov-report=json:"{env:CI_ARTIFACT_DIR}/coverage.json" --junitxml="{env:CI_ARTIFACT_DIR}/junit.xml" {posargs:tests}
setenv =
    CI_ARTIFACT_DIR = {env:CI_ARTIFACT_DIR:{toxworkdir}/reports/c1}
    COVERAGE_FILE = {env:COVERAGE_FILE:{env:CI_ARTIFACT_DIR}/.coverage}
commands_pre =
    python -c "import pathlib, sys; pathlib.Path(sys.argv[1]).mkdir(parents=True, exist_ok=True)" "{env:CI_ARTIFACT_DIR}"

[testenv:lint]
passenv = LANG
deps =
	black
	isort
	flake8
	mypy
commands =
	black .
	isort .
	flake8 .
	mypy weko_schema_ui


[testenv:radon]
passenv = LANG
deps = 
	radon
commands = 
	radon cc weko_schema_ui
	radon mi weko_schema_ui

