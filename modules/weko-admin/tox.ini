[tox]
envlist =
    ; py36
    ; c0
    c1
    ; lint

skip_missing_interpreters = true

[tool:pytest]
minversion = 3.0
testpaths = tests

[coverage:run]
source =
    weko_admin

[coverage:paths]
source =
    weko_admin
    .tox/*/lib/python*/site-packages/weko_admin

[flake8]
max-line-length = 119
exclude =
    .git
    __pychache__
    .tox
    venv

[isort]
profile=black

[pytest]
filterwarnings =
    ignore:ast.Str is deprecated:DeprecationWarning
    ignore:Attribute s is deprecated:DeprecationWarning


[tool:isort]
line_length = 119

[mypy]
python_version = 3.12.6
warn_return_any = True
warn_unused_configs = True

[mypy-flask]
ignore_missing_imports = True

[testenv]
passenv = LANG
deps =
    pytest>=3
commands =
    pytest -v --basetemp="{envtmpdir}" {posargs}

[testenv:c0]
setuptools_version = 57.5.0
passenv = LANG
deps =
    pytest>=3
    pytest-cov
commands =
    pytest --cov=weko_admin --cov-config=tox.ini tests -v --cov-report=term --basetemp="{envtmpdir}" {posargs}

[testenv:c1]
setuptools_version = 57.5.0
passenv =
    LANG
    INVENIO_OPENSEARCH_USER
    INVENIO_OPENSEARCH_PASS
    SQLALCHEMY_DATABASE_URI
    SEARCH_HOST
    SEARCH_OPENSEARCH_HOSTS
deps =
    pytest>=3
    pytest-cov
    -rrequirements2.txt
commands =
    pytest --cov=weko_admin --cov-config=tox.ini tests -v -vv -s --cov-branch --cov-report=term --cov-report=html --basetemp="{envtmpdir}" {posargs}

[testenv:lint]
passenv = LANG
deps =
    black
    isort
    flake8
    mypy
commands =
    black .
    isort .
    flake8 .
    mypy weko_admin


[testenv:radon]
passenv = LANG
deps =
    radon
commands =
    radon cc weko_admin
    radon mi weko_admin

