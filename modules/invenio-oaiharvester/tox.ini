[tox]
envlist =
    ; py36
    ; c0
    c1
	; lint
parallel_show_output = True
skip_missing_interpreters = true

[tool:pytest]
minversion = 3.0
testpaths = tests

[coverage:run]
source =
    invenio_oaiharvester

[coverage:paths]
source =
    invenio_oaiharvester
    .tox/*/lib/python*/site-packages/invenio_oaiharvester

[flake8]
max-line-length = 119
exclude =
    .git
    __pychache__
    .tox
    venv

[isort]
profile=black

[pytest]
timeout = 300
filterwarnings =
    default:ast\.Str is deprecated:DeprecationWarning:werkzeug\.routing\.rules
    default:Attribute s is deprecated:DeprecationWarning:werkzeug\.routing\.rules
    default:Attribute s is deprecated:DeprecationWarning:ast
    default:'_app_ctx_stack' is deprecated:DeprecationWarning:flask_sqlalchemy

[tool:isort]
line_length = 119

[mypy]
python_version = 3.6
warn_return_any = True
warn_unused_configs = True

[mypy-flask]
ignore_missing_imports = True

[testenv]
passenv = LANG
deps =
    pytest>=3
commands =
   pytest -v --basetemp="{envtmpdir}" {posargs}

[testenv:c0]
setuptools_version = 57.5.0
passenv = LANG
deps =
    pytest>=3
    pytest-cov
commands =
   pytest --cov=invenio_oaiharvester tests -v --cov-report=term --basetemp="{envtmpdir}" {posargs}

[testenv:c1]
setuptools_version = 57.5.0
passenv = LANG
    INVENIO_OPENSEARCH_USER
    INVENIO_OPENSEARCH_PASS
    SQLALCHEMY_DATABASE_URI
    CACHE_REDIS_URL
    CACHE_REDIS_HOST
    PYTHONPATH
    EVIDENCE_PREFIX
    COVERAGE_FILE
deps =
    pytest>=3
    pytest-cov
    -rrequirements2.txt
commands =
    python -m pytest --cov=invenio_oaiharvester --cov-config=tox.ini -v --cov-branch --cov-report=term --cov-report=xml:{envtmpdir}/coverage.xml --cov-report=html:{envtmpdir}/htmlcov --basetemp="{envtmpdir}" {posargs:tests}

[testenv:lint]
passenv = LANG
deps =
	black
	isort
	flake8
	mypy
commands =
	black .
	isort .
	flake8 .
	mypy invenio_oaiharvester


[testenv:radon]
passenv = LANG
deps = 
	radon
commands = 
	radon cc invenio_oaiharvester
	radon mi invenio_oaiharvester

