[tox]
envlist =
    ; py36
    ; c0
    c1
    ; lint

skip_missing_interpreters = true

[tool:pytest]
minversion = 3.0
testpaths = tests

[coverage:run]
source =
    invenio_accounts

[coverage:paths]
source =
    invenio_accounts
    .tox/*/lib/python*/site-packages/invenio_accounts

[flake8]
max-line-length = 119
exclude =
    .git
    __pychache__
    .tox
    venv

[isort]
profile=black

[pytest]
timeout = 300

[tool:isort]
line_length = 119

[mypy]
python_version = 3.6
warn_return_any = True
warn_unused_configs = True

[mypy-flask]
ignore_missing_imports = True

[testenv]
passenv = LANG
deps =
    pytest>=3
commands =
    pytest -v --basetemp="{envtmpdir}" {posargs}

[testenv:c0]
passenv = LANG
deps =
    pytest>=3
    pytest-cov
commands =
    pytest --cov=invenio_accounts tests -v --cov-report=term --cov-report=xml --cov-report=html --basetemp="{envtmpdir}" {posargs}

[testenv:c1]
setuptools_version = 57.5.0
passenv =
    LANG
    SQLALCHEMY_DATABASE_URI
    ACCOUNTS_SESSION_REDIS_URL
    PYTHONPATH
    EVIDENCE_PREFIX
    COVERAGE_FILE
    CI_ARTIFACT_DIR
    PYTEST_TIMEOUT
n = true
deps =
    pytest>=3
    pytest-cov
    -rrequirements2.txt
    pytest-timeout==2.4.0
commands =
    python -m pytest --cov=invenio_accounts -v --cov-branch --cov-report=term --cov-report=html:"{env:CI_ARTIFACT_DIR}/htmlcov" --basetemp="{envtmpdir}/pytest" --cov-config=tox.ini --cov-report=xml:"{env:CI_ARTIFACT_DIR}/coverage.xml" --cov-report=json:"{env:CI_ARTIFACT_DIR}/coverage.json" --junitxml="{env:CI_ARTIFACT_DIR}/junit.xml" {posargs:tests}
setenv =
    CI_ARTIFACT_DIR = {env:CI_ARTIFACT_DIR:{toxworkdir}/reports/c1}
    COVERAGE_FILE = {env:COVERAGE_FILE:{env:CI_ARTIFACT_DIR}/.coverage}
commands_pre =
    python -c "import pathlib, sys; pathlib.Path(sys.argv[1]).mkdir(parents=True, exist_ok=True)" "{env:CI_ARTIFACT_DIR}"

[testenv:lint]
passenv = LANG
deps =
    black
    isort
    flake8
    mypy
commands =
    black .
    isort .
    flake8 .
    mypy invenio_accounts


[testenv:radon]
passenv = LANG
deps =
    radon
commands =
    radon cc invenio_accounts
    radon mi invenio_accounts
