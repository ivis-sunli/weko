[tox]
envlist =
    ; py36
    ; c0
    c1
	; lint
parallel_show_output = True
skip_missing_interpreters = true

[tool:pytest]
minversion = 3.0
testpaths = tests

[coverage:run]
source =
    weko_logging

[coverage:paths]
source =
    weko_logging
    .tox/*/lib/python*/site-packages/weko_logging

[flake8]
max-line-length = 119
exclude =
    .git
    __pychache__
    .tox
    venv

[isort]
profile=black

[pytest]
timeout = 300
filterwarnings =
    default:ast\.Str is deprecated:DeprecationWarning:werkzeug\.routing\.rules
    default:Attribute s is deprecated:DeprecationWarning:werkzeug\.routing\.rules
    default:Attribute s is deprecated:DeprecationWarning:ast

[tool:isort]
line_length = 119

[mypy]
python_version = 3.6
warn_return_any = True
warn_unused_configs = True

[mypy-flask]
ignore_missing_imports = True

[testenv]
passenv = LANG
deps =
    pytest>=3
commands =
   pytest -v --basetemp="{envtmpdir}" {posargs}

[testenv:c0]
setuptools_version = 57.5.0
passenv = LANG
deps =
    pytest>=3
    pytest-cov
commands =
   pytest --cov=weko_logging tests --cov-report=term-missing --basetemp="{envtmpdir}" {posargs}

[testenv:c1]
passenv = LANG SQLALCHEMY_DATABASE_URI PYTHONPATH EVIDENCE_PREFIX
    COVERAGE_FILE
    CI_ARTIFACT_DIR
    CACHE_REDIS_URL
    PYTEST_TIMEOUT
setuptools_version = 57.5.0
deps =
    pytest>=3
    pytest-cov
    coverage
    -rrequirements2.txt
    pytest-timeout==2.4.0
commands =
   python -m pytest --cov=weko_logging -v --cov-branch --cov-report=term --cov-report=xml:"{env:CI_ARTIFACT_DIR}/coverage.xml" --cov-report=html:"{env:CI_ARTIFACT_DIR}/htmlcov" --basetemp="{envtmpdir}/pytest" --cov-config=tox.ini --cov-report=json:"{env:CI_ARTIFACT_DIR}/coverage.json" --junitxml="{env:CI_ARTIFACT_DIR}/junit.xml" {posargs:tests}
setenv =
    CI_ARTIFACT_DIR = {env:CI_ARTIFACT_DIR:{toxworkdir}/reports/c1}
    COVERAGE_FILE = {env:COVERAGE_FILE:{env:CI_ARTIFACT_DIR}/.coverage}
commands_pre =
    python -c "import pathlib, sys; pathlib.Path(sys.argv[1]).mkdir(parents=True, exist_ok=True)" "{env:CI_ARTIFACT_DIR}"

[testenv:lint]
passenv = LANG
deps =
	black
	isort
	flake8
	mypy
commands =
	black .
	isort . -c -v
	flake8 .
	mypy weko_logging


[testenv:radon]
passenv = LANG
deps =
	radon
commands =
	radon cc weko_logging
	radon mi weko_logging

