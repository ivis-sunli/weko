[tox]
envlist =
	; py36
	; c0
	c1
	; lint
parallel_show_output = True
skip_missing_interpreters = true

[tool:pytest]
minversion = 3.0
testpaths = tests

[coverage:run]
source =
	weko_indextree_journal

[coverage:paths]
source =
	weko_indextree_journal
	.tox/*/lib/python*/site-packages/weko_indextree_journal

[flake8]
max-line-length = 119
exclude =
	.git
	__pychache__
	.tox
	venv

[isort]
profile=black

[pytest]
timeout = 300
filterwarnings =
    default:ast\.Str is deprecated:DeprecationWarning:werkzeug\.routing\.rules
    default:Attribute s is deprecated:DeprecationWarning:werkzeug\.routing\.rules
    default:Attribute s is deprecated:DeprecationWarning:ast

[tool:isort]
line_length = 119

[mypy]
python_version = 3.6
warn_return_any = True
warn_unused_configs = True

[mypy-flask]
ignore_missing_imports = True

[testenv]
usedevelop = True
passenv =
    LANG
    SQLALCHEMY_DATABASE_URI
    PYTHONPATH
    EVIDENCE_PREFIX
    COVERAGE_FILE
deps =
	pytest>=3
commands =
	python -m pytest -v --basetemp="{envtmpdir}" {posargs:tests}

[testenv:c0]
setuptools_version = 57.5.0
passenv =
    LANG
    SQLALCHEMY_DATABASE_URI
    PYTHONPATH
    EVIDENCE_PREFIX
    COVERAGE_FILE
deps =
	pytest>=3
	pytest-cov
commands =
   python -m pytest --cov=weko_indextree_journal -v --cov-report=term --cov-config=tox.ini --basetemp="{envtmpdir}" {posargs:tests}

[testenv:c1]
setuptools_version = 57.5.0
passenv =
    LANG
    SQLALCHEMY_DATABASE_URI
    PYTHONPATH
    EVIDENCE_PREFIX
    COVERAGE_FILE
deps =
	pytest>=3
	pytest-cov
	-rrequirements2.txt
commands =
	# pytest --cov=weko_indextree_journal tests -v --cov-branch --cov-report=term --cov-report=xml --basetemp="{envtmpdir}" {posargs}
	python -m pytest --cov=weko_indextree_journal -v --cov-branch --cov-report=term --cov-report=html:{envtmpdir}/htmlcov --cov-config=tox.ini --basetemp="{envtmpdir}" {posargs:tests}

[testenv:lint]
passenv = LANG
deps =
	black
	isort
	flake8
	mypy
commands =
	black .
	isort .
	flake8 .
	mypy weko_indextree_journal


[testenv:radon]
passenv = LANG
deps =
	radon
commands =
	radon cc weko_indextree_journal
	radon mi weko_indextree_journal

