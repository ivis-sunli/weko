[tox]
envlist =
    ; py36
    ; c0
    c1
    ; lint

skip_missing_interpreters = true

[tool:pytest]
minversion = 3.0
testpaths = tests

[coverage:run]
source =
    invenio_iiif

[coverage:paths]
source =
    invenio_iiif
    .tox/*/lib/python*/site-packages/invenio_iiif

[flake8]
max-line-length = 119
exclude =
    .git
    __pychache__
    .tox
    venv

[isort]
profile=black

[pytest]
timeout = 300

[tool:isort]
line_length = 119

[mypy]
python_version = 3.6
warn_return_any = True
warn_unused_configs = True

[mypy-flask]
ignore_missing_imports = True

[testenv]
passenv = LANG
deps =
    pytest>=3
    -rrequirements2.txt
commands =
    pytest -v --basetemp="{envtmpdir}" {posargs}

[testenv:c0]
setuptools_version = 57.5.0
passenv = LANG
deps =
    pytest>=3
    pytest-cov
    -rrequirements.txt
commands =
    pytest --cov=invenio_iiif tests -v --cov-report=term --cov-report=xml --cov-report=html --basetemp="{envtmpdir}" {posargs}

[testenv:c1]
setuptools_version = 57.5.0
passenv =
    LANG
    SQLALCHEMY_DATABASE_URI
    CACHE_REDIS_HOST
    CACHE_REDIS_URL
    PYTHONPATH
    EVIDENCE_PREFIX
deps =
    pytest>=3
    pytest-cov
    -rrequirements2.txt
commands =
    python -m pytest --cov=invenio_iiif --cov-config=tox.ini -v -vv -s --cov-branch --cov-report=term --cov-report=xml:{envdir}/coverage.xml --cov-report=html:{envdir}/htmlcov --basetemp="{envtmpdir}" {posargs:tests}

[testenv:lint]
passenv = LANG
deps =
    black
    isort
    flake8
    mypy
commands =
    black .
    isort .
    flake8 .
    mypy invenio_iiif


[testenv:radon]
passenv = LANG
deps =
    radon
commands =
    radon cc invenio_iiif
    radon mi invenio_iiif

