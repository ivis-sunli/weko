[tox]
envlist =
    ; py36
    ; c0
    c1
	; lint
parallel_show_output = True
skip_missing_interpreters = true

[tool:pytest]
minversion = 3.0
testpaths = tests

[coverage:run]
source =
    invenio_s3

[coverage:paths]
source =
    invenio_s3
    .tox/*/lib/python*/site-packages/invenio_s3

[flake8]
max-line-length = 119
exclude =
    .git
    __pychache__
    .tox
    venv

[isort]
profile=black

[pytest]
timeout = 300

[tool:isort]
line_length = 119

[mypy]
python_version = 3.6
warn_return_any = True
warn_unused_configs = True

[mypy-flask]
ignore_missing_imports = True

[testenv]
usedevelop = True
passenv =
    LANG
    SQLALCHEMY_DATABASE_URI
    PYTHONPATH
    EVIDENCE_PREFIX
    COVERAGE_FILE
deps =
    pytest>=3
commands =
   python -m pytest -v --basetemp="{envtmpdir}" {posargs:tests}

[testenv:c0]
setuptools_version = 57.5.0
passenv =
    LANG
    SQLALCHEMY_DATABASE_URI
    PYTHONPATH
    EVIDENCE_PREFIX
    COVERAGE_FILE
deps =
    pytest>=3
    pytest-cov
commands =
   python -m pytest --cov=invenio_s3 -v --cov-report=term --cov-config=tox.ini --basetemp="{envtmpdir}" {posargs:tests}

[testenv:c1]
setuptools_version = 57.5.0
passenv =
    LANG
    SQLALCHEMY_DATABASE_URI
    PYTHONPATH
    EVIDENCE_PREFIX
    COVERAGE_FILE
deps =
    pytest>=3
    pytest-cov
    coverage
	-rrequirements2.txt
commands =
   python -m pytest --cov=invenio_s3 -v --cov-branch --cov-report=term --cov-report=xml:{envtmpdir}/coverage.xml --cov-report=html:{envtmpdir}/htmlcov  --cov-config=tox.ini --basetemp="{envtmpdir}" {posargs:tests}


[testenv:lint]
passenv = LANG
deps =
	black
	isort
	flake8
	mypy
commands =
	black .
	isort .
	flake8 .
	mypy invenio_s3


[testenv:radon]
passenv = LANG
deps =
	radon
commands =
	radon cc invenio_s3
	radon mi invenio_s3

